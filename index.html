<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Launcher</title>
<style>
:root{
  --glass:rgba(255,255,255,.10);
  --glass2:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.18);
  --txt:#f4f6fb;
  --dim:rgba(244,246,251,.62);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* 1rem = 20px en una TV de 1920px de ancho; todo escala solo */
html{font-size:calc(100vw / 96)}
body{--lift:0rem}
body.minifocus{--lift:3.8rem}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--txt);
  font-family:"Google Sans","Product Sans",Roboto,"Segoe UI",Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;outline:none;cursor:pointer}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}

/* ---------- Fondo ---------- */
#wall{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden;transition:opacity .4s}
#wall>*{position:absolute;top:0;right:0;bottom:0;left:0}
#stars,#scene,#drive,#aurora,#pic{display:none}
#pic{background-size:cover;background-position:center;background-repeat:no-repeat}
.wp-pic #pic{display:block}
.wp-pic #pic::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.38))}
.wp-pic{background:#000}
.wp-pic #glow.on,.wp-pic #glow2.on{opacity:.5}
.wp-drive #drive{display:block}
.wp-aurora #aurora{display:block}
.wp-stars{background:linear-gradient(180deg,#05060b 0%,#0a0f1d 55%,#101a30 100%)}
.wp-drive{background:linear-gradient(180deg,#0c0420 0%,#2a0b52 45%,#ff2e88 70%,#ff9a3c 72%,#0a0318 72.2%)}
.wp-aurora{background:#050a14}
#scene svg{position:absolute;left:0;top:0;width:100%;height:100%;stroke:none}
#glow,#glow2{opacity:0;transition:opacity .5s;--gc:120,140,255;--gx:50%;pointer-events:none;
  background:
    radial-gradient(70rem 60rem at 0% 85%,rgba(0,0,0,.6),rgba(0,0,0,0) 70%),
    radial-gradient(125rem 85rem at 70% 8%,rgba(var(--gc),.95) 0%,rgba(var(--gc),.62) 28%,rgba(var(--gc),.24) 58%,rgba(var(--gc),0) 82%),
    linear-gradient(180deg,rgba(var(--gc),.14),rgba(var(--gc),.04))}
#glow.on,#glow2.on{opacity:1}
#glow.flash,#glow2.flash{animation:flash .9s ease-out}
@keyframes flash{0%{filter:brightness(1.7) saturate(1.3)}35%{filter:brightness(1.25)}100%{filter:none}}
#shade{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
/* synthwave */
#drive .sun{position:absolute;left:50%;top:34%;width:20rem;height:20rem;margin-left:-10rem;border-radius:50%;
  background:linear-gradient(180deg,#ffe36b,#ff3d8f);filter:blur(.15rem)}
#drive .grid{position:absolute;left:-50%;right:-50%;top:72%;bottom:-40%;
  background-image:linear-gradient(rgba(255,60,200,.85) .12rem,transparent .12rem),
                   linear-gradient(90deg,rgba(255,60,200,.85) .12rem,transparent .12rem);
  background-size:4rem 4rem;transform:perspective(30rem) rotateX(62deg);transform-origin:top center}
#drive .glow{position:absolute;left:0;right:0;top:60%;height:20%;background:linear-gradient(180deg,transparent,rgba(0,220,255,.25),transparent)}
/* aurora */
#aurora i{position:absolute;border-radius:50%;filter:blur(7rem);opacity:.75;animation:drift 18s ease-in-out infinite alternate}
#aurora i:nth-child(1){width:46rem;height:30rem;left:-6rem;top:8rem;background:#1fd5a4}
#aurora i:nth-child(2){width:40rem;height:34rem;right:-4rem;top:-4rem;background:#5a4bff;animation-delay:-6s}
#aurora i:nth-child(3){width:36rem;height:26rem;left:34rem;bottom:-6rem;background:#00a6ff;animation-delay:-11s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(4rem,-3rem,0) scale(1.18)}}

/* ---------- Cabecera ---------- */
#top{position:fixed;left:5rem;right:5rem;top:3.2rem;display:flex;align-items:center;justify-content:space-between;z-index:5}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.07) 45%,rgba(255,255,255,.14) 100%);
  border:.08rem solid rgba(255,255,255,.34);
  box-shadow:inset 0 .12rem .25rem rgba(255,255,255,.55),inset 0 -.15rem .35rem rgba(255,255,255,.12),0 .8rem 2.2rem rgba(0,0,0,.28);
  -webkit-backdrop-filter:blur(1.4rem) saturate(1.7);backdrop-filter:blur(1.4rem) saturate(1.7)}
#clock{display:flex;align-items:center;gap:1.5rem;padding:.9rem 2rem .9rem 1.8rem;border-radius:2.6rem;text-shadow:0 .1rem .5rem rgba(0,0,0,.35)}
#clock .ct{display:flex;flex-direction:column;line-height:1.05}
#time{font-size:2.9rem;font-weight:600;letter-spacing:.02rem}
#date{font-size:1.1rem;font-weight:400;color:rgba(255,255,255,.78);margin-top:.25rem}
#left{display:flex;align-items:center;gap:1.2rem}
#wx{display:flex;align-items:center;gap:1rem;padding:.9rem 2rem .9rem 1.6rem;border-radius:2.6rem;text-shadow:0 .1rem .5rem rgba(0,0,0,.35)}
#wx.hide{display:none}
#wxi{font-size:3rem;display:flex}
#wxi svg{stroke-width:1.5}
#wx .wt{display:flex;flex-direction:column;line-height:1.05}
#wxt{font-size:2.2rem;font-weight:500}
#wxc{font-size:1rem;color:rgba(255,255,255,.78);margin-top:.2rem}
#pills{display:flex;gap:1.8rem}
#bPanel{margin:0 .8rem}
.pill{display:flex;align-items:center;gap:.7rem;height:3.4rem;padding:0 1.5rem;border-radius:2rem;
  background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.07) 50%,rgba(255,255,255,.14));border:.08rem solid rgba(255,255,255,.34);
  box-shadow:inset 0 .1rem .2rem rgba(255,255,255,.5),0 .5rem 1.4rem rgba(0,0,0,.25);-webkit-backdrop-filter:blur(1.2rem) saturate(1.6);backdrop-filter:blur(1.2rem) saturate(1.6);font-size:1.3rem;font-weight:500;
  transition:background .15s,transform .15s,color .15s}
.pill.round{width:3.4rem;padding:0;justify-content:center;font-size:1.6rem}
.pill svg{font-size:1.5rem}

#clock{text-align:left;cursor:pointer;transition:background .15s,transform .15s,color .15s}
#clock:focus #date{color:#4a5060;text-shadow:none}
#clock:focus .ct{text-shadow:none}

/* ---------- Tarjeta del clima (al presionar la fecha/hora) ---------- */
#wxo{position:fixed;top:0;right:0;bottom:0;left:0;z-index:12;background:rgba(0,0,0,.38);-webkit-backdrop-filter:blur(.5rem);backdrop-filter:blur(.5rem);
  display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:opacity .25s,visibility 0s .25s}
#wxo.open{visibility:visible;opacity:1;transition:opacity .25s}
#wxcard{width:62rem;padding:3rem 3.4rem 2.6rem;border-radius:3.2rem;color:#fff;text-shadow:0 .1rem .6rem rgba(0,0,0,.3);
  transform:scale(.94) translateY(1.5rem);transition:transform .3s cubic-bezier(.2,.9,.3,1.1);
  background:linear-gradient(135deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,.08) 45%,rgba(255,255,255,.18) 100%);
  -webkit-backdrop-filter:blur(2.2rem) saturate(1.8);backdrop-filter:blur(2.2rem) saturate(1.8)}
#wxo.open #wxcard{transform:none}
#wxcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:2rem}
#wxd{font-size:1.5rem;font-weight:500;letter-spacing:.05rem;opacity:.95}
#wxbig{display:flex;align-items:flex-start;line-height:1;margin-top:1rem}
#wxbig b{font-size:9.2rem;font-weight:500;letter-spacing:-.3rem}
#wxbig span{font-size:6.2rem;font-weight:200;margin:.2rem 0 0 .2rem;opacity:.9}
#wxcard .right{padding-top:.4rem;min-width:19rem}
#wxci{font-size:3.4rem;display:flex}
#wxci svg{stroke-width:1.4}
#wxfeel{font-size:1.5rem;margin:1rem 0 1.2rem}
#wxcond{font-size:1.2rem;opacity:.8;margin:-.8rem 0 1.2rem}
#wxhl{display:flex;gap:.9rem}
#wxhl i{font-style:normal;font-size:1.5rem;font-weight:500;padding:.6rem 1.2rem;border-radius:1.2rem;background:rgba(0,0,0,.2);border:.06rem solid rgba(255,255,255,.18)}
#wxdays{display:flex;justify-content:space-between;margin-top:2.2rem}
.dchip{min-width:6.6rem;padding:.9rem 1rem;border-radius:1.4rem;font-family:"SF Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;font-size:1.4rem;letter-spacing:.12rem;text-align:center;text-transform:uppercase;transition:background .15s,transform .15s,color .15s}
.dchip.sel{background:rgba(255,255,255,.28)}
.dchip.f:focus{text-shadow:none}
#wxnone{font-size:1.4rem;opacity:.8;text-align:center;padding:1rem 0}

/* ---------- Foco ---------- */
.f:focus{background:#fff!important;color:#10131c!important;transform:scale(1.05);z-index:3}
.f:focus svg{stroke:#10131c}
.f:focus .fillicon{fill:#10131c}

/* ---------- Música (home) ---------- */
#np{position:fixed;left:5rem;right:5rem;bottom:calc(21.6rem + var(--lift));z-index:4;transition:opacity .25s,bottom .3s}
body.apptitle #np{opacity:0;pointer-events:none}
#np .row{display:flex;gap:2rem;align-items:flex-end}
#art{width:8.4rem;height:8.4rem;border-radius:1rem;object-fit:cover;background:var(--glass2);box-shadow:0 .5rem 1.6rem rgba(0,0,0,.45)}
#np .meta{flex:1;min-width:0}
#ttl{font-size:2.5rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 .1rem .8rem rgba(0,0,0,.5)}
#art2{font-size:1.3rem;color:var(--dim);margin:.2rem 0 .9rem}
.ctl{display:flex;gap:1rem;align-items:center}
.cb{width:3.2rem;height:3.2rem;border-radius:50%;border:.1rem solid var(--line);background:var(--glass);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.cb svg{stroke:none;fill:currentColor}
.f:focus.cb svg{fill:#10131c}
.listen{display:flex;align-items:center;gap:.7rem;height:3.4rem;padding:0 1.8rem;border-radius:2rem;font-size:1.25rem;font-weight:500;color:#fff;
  background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.07) 50%,rgba(255,255,255,.18));border:.1rem solid rgba(255,255,255,.42);
  box-shadow:inset 0 .15rem .25rem rgba(255,255,255,.6),inset 0 -.12rem .25rem rgba(255,255,255,.15),0 .5rem 1.4rem rgba(0,0,0,.25);
  -webkit-backdrop-filter:blur(.8rem) saturate(1.7);backdrop-filter:blur(.8rem) saturate(1.7);text-shadow:0 .1rem .4rem rgba(0,0,0,.35)}
.listen svg{stroke:#fff}
.listen:focus{box-shadow:0 0 1.4rem rgba(255,255,255,.4)}

/* ---------- Reproductor (cristal líquido) ---------- */
#plo{position:fixed;top:0;right:0;bottom:0;left:0;z-index:14;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(.6rem);backdrop-filter:blur(.6rem);
  visibility:hidden;opacity:0;transition:opacity .25s,visibility 0s .25s}
#plo.open{visibility:visible;opacity:1;transition:opacity .25s}
#pl{position:relative;isolation:isolate;overflow:hidden;width:70rem;padding:3rem 3.2rem 2.6rem;border-radius:3.4rem;color:#fff;text-shadow:0 .1rem .6rem rgba(0,0,0,.35);
  transform:scale(.93) translateY(1.5rem);transition:transform .45s cubic-bezier(.2,.9,.3,1.15)}
#plo.open #pl{transform:none}
#pl::before{content:"";position:absolute;left:5%;right:5%;top:.2rem;height:30%;border-radius:3rem 3rem 60% 60%/3rem 3rem 100% 100%;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));pointer-events:none;z-index:1}
#plBg{position:absolute;left:-6rem;top:-6rem;width:calc(100% + 12rem);height:calc(100% + 12rem);object-fit:cover;filter:blur(3rem) saturate(1.8);opacity:.6;z-index:-1}
#plBg:not([src]),#plArt:not([src]){visibility:hidden}
#pl .plmain{position:relative;z-index:2;display:flex;gap:3rem;align-items:center}
#plArt{width:17rem;height:17rem;flex:none;border-radius:2.2rem;object-fit:cover;background:var(--glass2);border:.1rem solid rgba(255,255,255,.45);box-shadow:0 1.2rem 3rem rgba(0,0,0,.5)}
#pl .plinfo{flex:1;min-width:0}
#plTtl{font-size:3rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#plArtist{font-size:1.5rem;color:rgba(255,255,255,.8);margin:.3rem 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#plBar{display:flex;align-items:center;gap:1rem;margin:1.8rem 0 1.6rem;font-size:1.1rem;color:rgba(255,255,255,.8)}
#plBar .trk{flex:1;height:.4rem;border-radius:.3rem;background:rgba(255,255,255,.25);overflow:hidden}
#plBar .trk i{display:block;height:100%;width:0;background:#fff;border-radius:.3rem;transition:width .9s linear}
#pl .plctl{display:flex;gap:1.2rem;align-items:center}
.pb{position:relative;width:5rem;height:5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#fff;
  background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.07) 50%,rgba(255,255,255,.18));border:.1rem solid rgba(255,255,255,.45);
  box-shadow:inset 0 .18rem .3rem rgba(255,255,255,.65),inset 0 -.15rem .3rem rgba(255,255,255,.18),0 .6rem 1.6rem rgba(0,0,0,.3);transition:background .15s,transform .15s}
.pb.big{width:6.2rem;height:6.2rem;font-size:2.2rem}
.pb svg{stroke:none;fill:currentColor}
.pb.open{width:auto;border-radius:3rem;padding:0 2rem;gap:.8rem;font-size:1.3rem;font-weight:500;margin-left:auto;height:4.6rem}
.pb.open svg{stroke:currentColor;fill:none}
#pl .f:focus{background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.2) 55%,rgba(255,255,255,.38))!important;color:#fff!important;transform:scale(1.1);
  box-shadow:inset 0 .2rem .35rem rgba(255,255,255,.95),inset 0 -.2rem .4rem rgba(255,255,255,.4),0 0 1.6rem rgba(255,255,255,.4),0 .9rem 2.2rem rgba(0,0,0,.35)}
#pl .f:focus.pb svg{fill:#fff;stroke:none}
#pl .f:focus.pb.open svg{stroke:#fff;fill:none}
#plQ{position:relative;z-index:2;margin-top:2.2rem;padding-top:1.4rem;border-top:.08rem solid rgba(255,255,255,.25)}
#plQh{font-size:1.1rem;letter-spacing:.12rem;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:.7rem}
#plQl .qi{display:flex;gap:1.2rem;align-items:baseline;height:2.7rem;font-size:1.3rem;white-space:nowrap}
#plQl .qi b{width:1.8rem;font-weight:500;color:rgba(255,255,255,.55)}
#plQl .qi span{overflow:hidden;text-overflow:ellipsis}
#plQl .qi small{margin-left:auto;font-size:1.1rem;color:rgba(255,255,255,.65);overflow:hidden;text-overflow:ellipsis;max-width:40%}
#bar{display:flex;align-items:center;gap:1rem;margin-top:1.4rem;font-size:1.1rem;color:var(--dim)}
#bar .trk{flex:1;height:.28rem;border-radius:.2rem;background:rgba(255,255,255,.25);overflow:hidden}
#bar .trk i{display:block;height:100%;width:0;background:#fff}

/* ---------- Dock de apps ---------- */
#dock{position:fixed;left:5rem;right:5rem;bottom:calc(10.8rem + var(--lift));height:9.2rem;border-radius:2rem;transition:bottom .3s;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));border:.08rem solid var(--line);
  overflow:hidden;z-index:4}
#row{display:flex;align-items:center;gap:1.9rem;height:100%;padding:0 1.8rem;width:max-content}
.tile{position:relative;flex:none;width:9.8rem;height:5.5rem;border-radius:1rem;overflow:hidden;
  background:rgba(20,24,40,.85);border:.08rem solid var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.4rem;transition:width .22s,height .22s,transform .22s}
.tile img{display:block}
.tile.banner img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}
.tile.icon img{width:2.8rem;height:2.8rem;border-radius:.6rem}
.tile .tl{font-size:.95rem;font-weight:500;padding:0 .6rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile.banner .tl{display:none}
.tile.f:focus{width:12.8rem;height:7.2rem;transform:none;background:rgba(20,24,40,.96)!important;color:#fff!important;
  border:.1rem solid rgb(var(--tc,255,255,255));
  box-shadow:0 0 1.1rem .05rem rgba(var(--tc,255,255,255),.55)}
.tile.f:focus .tl{color:#fff}
.tile{--tc:255,255,255}
.tile.allapps{width:7rem}
.tile.allapps:focus{width:9rem}
.tile.allapps svg{font-size:2.4rem}

/* título de la app seleccionada */
#apptitle{position:fixed;left:5rem;right:5rem;bottom:calc(21.6rem + var(--lift));z-index:4;opacity:0;pointer-events:none;transition:opacity .25s,bottom .3s;text-shadow:0 .1rem .9rem rgba(0,0,0,.55)}
body.apptitle #apptitle{opacity:1}
#apptitle .at{font-size:5.2rem;font-weight:500;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.05rem}
#apptitle .as{font-size:1.35rem;color:var(--dim);margin-top:.8rem}
#apptitle .as b{color:#fff;font-weight:500}
#apptitle .dots{display:flex;gap:.8rem;align-items:center;margin-top:1.8rem;height:1rem}
#apptitle .dots i{width:.9rem;height:.9rem;border-radius:50%;background:rgba(255,255,255,.38);transition:width .2s,background .2s}
#apptitle .dots i.on{width:3.8rem;border-radius:.5rem;background:#fff}
#apptitle.pop .at,#apptitle.pop .as{animation:pop .3s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(.8rem)}to{opacity:1;transform:none}}

/* fila de las demás apps + botón de biblioteca */
#more{position:fixed;left:5rem;right:5rem;bottom:5.6rem;height:calc(4.2rem + var(--lift));border-radius:2rem;overflow:hidden;z-index:4;transition:height .3s;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border:.08rem solid var(--line)}
#mnone{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:flex-start;padding-top:1.4rem;justify-content:center;font-size:1.25rem;color:var(--dim)}
#mrow{display:flex;align-items:flex-start;gap:1.7rem;height:100%;padding:1rem 1.8rem 0;width:max-content}
.tile.mini{width:9rem;height:5.2rem;border-radius:1rem;gap:.2rem}
.tile.mini.icon img{width:2.7rem;height:2.7rem;border-radius:.6rem}
.tile.mini .tl{font-size:.95rem}
.tile.mini.f:focus{width:10.8rem;height:6.1rem;box-shadow:0 0 .9rem .05rem rgba(var(--tc,255,255,255),.5)}
#libbtn{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:1.4rem;z-index:4;height:3.4rem;padding:0 2.4rem;font-size:1.3rem;border-radius:2.2rem}
#libbtn svg{font-size:1.6rem}

/* ---------- Panel de control ---------- */
#panel{position:fixed;right:5rem;top:8.4rem;width:34rem;z-index:8;visibility:hidden;opacity:0;
  transform:translateX(2.5rem);transition:opacity .2s,transform .2s,visibility 0s .2s}
#panel.open{visibility:visible;opacity:1;transform:none;transition:opacity .2s,transform .2s}
#grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:4.9rem;gap:1.3rem}
.card{border-radius:1.8rem;background:rgba(40,46,64,.78);border:.08rem solid var(--line);padding:1rem 1.3rem;
  display:flex;align-items:center;gap:1rem;text-align:left;transition:background .15s,transform .15s}
.card .ci{width:2.9rem;height:2.9rem;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex:none}
.card .ct{min-width:0}
.card b{display:block;font-size:1.25rem;font-weight:600}
.card small{display:block;font-size:1.05rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f:focus.card small{color:#4a5060}
.f:focus .ci{background:rgba(0,0,0,.1)}
#pmedia{grid-row:span 2;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:1.1rem}
#pmedia img{width:3.8rem;height:3.8rem;border-radius:.7rem;background:var(--glass2);object-fit:cover}
#pmedia .pm-b{width:100%}
#pmedia .pm-b b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.2rem}
#prow{grid-column:span 2;display:flex;justify-content:space-between;padding:.3rem .2rem}
.rb{width:4.7rem;height:4.7rem;border-radius:50%;background:rgba(40,46,64,.78);border:.08rem solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.8rem}
#ram{margin:1.2rem 0 0;padding:.7rem 1.4rem;border-radius:1.4rem;background:rgba(40,46,64,.78);border:.08rem solid var(--line);font-size:1.05rem;color:var(--dim);text-align:right}

/* ---------- Todas las apps ---------- */
#all{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9;background:rgba(5,8,16,.9);padding:6rem 5rem 3rem;visibility:hidden;opacity:0;transition:opacity .2s,visibility 0s .2s}
#all.open{visibility:visible;opacity:1;transition:opacity .2s}
#all h2{font-size:2rem;font-weight:600;margin-bottom:2rem}
#allH{font-size:1.25rem;color:var(--dim);margin:-1.2rem 0 1.8rem}
#apps{display:grid;grid-template-columns:repeat(8,1fr);gap:1.6rem;max-height:calc(100vh - 21rem);overflow-y:auto;overflow-x:hidden;padding:.5rem;margin:-.5rem;scrollbar-width:none}
#apps::-webkit-scrollbar{display:none}
.app{position:relative}
.app .pin{position:absolute;top:.6rem;right:.6rem;width:2.1rem;height:2.1rem;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.app .pin svg{stroke:#fff!important;stroke-width:2.4}
.app .pin .ck{display:none}
.app.pinned .pin{background:#22b55e}
.app.pinned .pin .ck{display:flex}
.app.pinned .pin .pl{display:none}
.app .pin span{display:flex}
.app{display:flex;flex-direction:column;align-items:center;gap:.8rem;padding:1.3rem .6rem;border-radius:1.4rem;background:var(--glass);font-size:1.1rem;transition:transform .15s}
.app img{width:5.4rem;height:5.4rem;border-radius:1.1rem;object-fit:cover}
.app span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .ph{width:5.4rem;height:5.4rem;border-radius:1.1rem;background:var(--glass2)}

/* ---------- Liquid Blast ---------- */
@keyframes jelly{0%{transform:scale(.94,1.05)}35%{transform:scale(1.07,.95)}65%{transform:scale(.98,1.03)}100%{transform:none}}
#defs{position:absolute;width:0;height:0}
.blast{position:fixed;left:0;top:0;z-index:3;pointer-events:none;filter:url(#goo)}
.blast i{position:absolute}
.tile.f.moving:focus{animation:wob .35s ease-in-out infinite alternate;box-shadow:0 1.2rem 2rem rgba(0,0,0,.5),0 0 1.4rem rgba(var(--tc),.75)}
@keyframes wob{from{transform:rotate(-1.6deg) translateY(-.4rem)}to{transform:rotate(1.6deg) translateY(-.4rem)}}
#all.rep .pin{display:none}

/* ---------- Menú contextual (liquid glass) ---------- */
#ctxo{position:fixed;top:0;right:0;bottom:0;left:0;z-index:14;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(.4rem);backdrop-filter:blur(.4rem);visibility:hidden;opacity:0;transition:opacity .2s,visibility 0s .2s}
#ctxo.open{visibility:visible;opacity:1;transition:opacity .2s}
#ctx{position:absolute;width:30rem;padding:1rem;border-radius:2.6rem;overflow:hidden;opacity:0;transform-origin:var(--ox,50%) 100%;
  background:radial-gradient(120% 70% at 15% 0%,rgba(255,255,255,.38),rgba(255,255,255,0) 60%),linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.05) 50%,rgba(255,255,255,.14)),rgba(18,22,36,.4);
  border:.08rem solid rgba(255,255,255,.38);
  box-shadow:inset 0 .14rem .3rem rgba(255,255,255,.6),inset 0 -.2rem .5rem rgba(255,255,255,.12),0 1.2rem 3rem rgba(0,0,0,.4);
  -webkit-backdrop-filter:blur(2.2rem) saturate(1.9);backdrop-filter:blur(2.2rem) saturate(1.9)}
#ctxo.open #ctx{animation:liquidIn .6s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes liquidIn{0%{transform:scale(.4,.25) translateY(2rem);opacity:0;border-radius:8rem}40%{transform:scale(1.07,.93);opacity:1}65%{transform:scale(.98,1.03)}100%{transform:none;opacity:1;border-radius:2.6rem}}
.ctxh{display:flex;align-items:center;gap:1rem;padding:.4rem .8rem .9rem;font-size:1.3rem;text-shadow:0 .1rem .4rem rgba(0,0,0,.4)}
.ctxh img{width:2.8rem;height:2.8rem;border-radius:.6rem;object-fit:cover}
.ctxh b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxi{display:flex;align-items:center;gap:1.1rem;width:100%;height:4rem;padding:0 1.3rem;margin-top:.3rem;border-radius:1.6rem;text-align:left;font-size:1.3rem;font-weight:500;transition:background .15s,transform .15s,color .15s}
.ctxi.f:focus{transform:scale(1.03)}
.ctxi .ci{font-size:1.7rem;display:flex}
.ctxi.dn{color:#ff9a9a}
.ctxi.sep{margin-top:.8rem;position:relative}
.ctxi.sep::before{content:"";position:absolute;left:1rem;right:1rem;top:-.5rem;height:.06rem;background:rgba(255,255,255,.25)}

/* ---------- Selector de cristal líquido ---------- */
.lens{position:absolute;left:0;top:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .2s;border-radius:1.4rem;
  background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,0) 45%,rgba(255,255,255,.06));
  border:.1rem solid rgba(255,255,255,.8);
  box-shadow:inset 0 .08rem .12rem rgba(255,255,255,.45),0 0 1.4rem rgba(var(--tc,255,255,255),.55)}
.lens::after{content:"";position:absolute;inset:-.25rem;border-radius:1.6rem;border:.08rem solid rgba(255,255,255,.32)}
.lens.on{opacity:1}

/* ---------- Salvapantallas ---------- */
#saver{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;background:#000;overflow:hidden;visibility:hidden;opacity:0;transition:opacity .8s,visibility 0s .8s}
#saver.on{visibility:visible;opacity:1;transition:opacity .8s}
#saver .sl{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;transition:opacity 1.6s}
#saver .sl.cur{opacity:1}
#saver .bg{position:absolute;inset:-4rem;background-size:cover;background-position:center;filter:blur(2.4rem) brightness(.55) saturate(1.4)}
#saver .fr{position:absolute;left:50%;top:46%;height:74%;max-width:70%;transform:translate(-50%,-50%);border-radius:2.6rem;object-fit:contain;
  border:.1rem solid rgba(255,255,255,.4);box-shadow:0 0 0 .5rem rgba(255,255,255,.08),0 2rem 5rem rgba(0,0,0,.5)}
#saver .sl.cur .fr{animation:drift2 9s ease-in-out infinite alternate}
@keyframes drift2{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-52%) scale(1.06)}}
#saverHint{position:absolute;left:50%;bottom:3.2rem;transform:translateX(-50%);padding:1rem 2.6rem;border-radius:2.4rem;font-size:1.4rem;font-weight:500;text-shadow:0 .1rem .5rem rgba(0,0,0,.4);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.6;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.04)}}

/* ---------- Reloj grande ---------- */
#big{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;background:radial-gradient(circle at 50% 40%,rgba(10,16,34,.55),rgba(0,0,0,.92));display:none;align-items:center;justify-content:center;flex-direction:column}
#big.open{display:flex}
#bigtime{font-size:15rem;font-weight:300;letter-spacing:.2rem}
#bigdate{font-size:2.2rem;color:var(--dim);margin-top:.5rem}

#toast{position:fixed;left:50%;bottom:2rem;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:.7rem 1.6rem;border-radius:1.4rem;font-size:1.1rem;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}

/* ---------- Cristal líquido v2: transparente y nítido (sin desenfoque de fondo) ---------- */
.tile.f:focus{background:rgba(255,255,255,.05)!important;border:.1rem solid rgba(255,255,255,.0);box-shadow:none}
.tile.f.moving:focus{box-shadow:0 1.2rem 2rem rgba(0,0,0,.4)}
.lens{border-radius:1.5rem;border:.12rem solid rgba(255,255,255,.6);
  background:linear-gradient(135deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.03) 34%,rgba(255,255,255,0) 60%,rgba(255,255,255,.2) 100%);
  box-shadow:inset 0 .2rem .35rem rgba(255,255,255,.85),inset 0 -.2rem .4rem rgba(255,255,255,.42),inset .18rem 0 .3rem rgba(255,255,255,.3),inset -.18rem 0 .3rem rgba(255,255,255,.3),
             0 .8rem 2rem rgba(0,0,0,.35),0 0 1.4rem rgba(var(--tc,255,255,255),.5);
  -webkit-backdrop-filter:saturate(1.7) brightness(1.12);backdrop-filter:saturate(1.7) brightness(1.12)}
.lens::before{content:"";position:absolute;left:6%;right:6%;top:.2rem;height:38%;border-radius:1.3rem 1.3rem 60% 60%/1.3rem 1.3rem 100% 100%;
  background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0));pointer-events:none}
.lens::after{border:.08rem solid rgba(255,255,255,.4)}

/* menú de la app: fondo de atrás nítido y menú transparente */
#ctxo,#wxo{background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
#ctx{background:radial-gradient(120% 70% at 15% 0%,rgba(255,255,255,.30),rgba(255,255,255,0) 55%),linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.02) 50%,rgba(255,255,255,.10)),rgba(8,12,26,.22);
  border:.1rem solid rgba(255,255,255,.5);
  box-shadow:inset 0 .2rem .35rem rgba(255,255,255,.75),inset 0 -.2rem .4rem rgba(255,255,255,.3),0 1.4rem 3rem rgba(0,0,0,.35);
  -webkit-backdrop-filter:saturate(1.6) brightness(1.08);backdrop-filter:saturate(1.6) brightness(1.08)}
.ctxi{text-shadow:0 .1rem .5rem rgba(0,0,0,.45)}
.ctxi.f:focus{background:linear-gradient(135deg,rgba(255,255,255,.36),rgba(255,255,255,.12))!important;color:#fff!important;
  box-shadow:inset 0 .12rem .22rem rgba(255,255,255,.8),inset 0 -.1rem .2rem rgba(255,255,255,.3),0 0 1rem rgba(255,255,255,.2)}
.ctxi.f:focus svg{stroke:#fff}
.ctxi.dn.f:focus{color:#ffc4c4!important}
.ctxi.dn.f:focus svg{stroke:#ffc4c4}

/* ---------- Centro de control: cristal líquido ---------- */
#panel .card,#panel .rb,#panel #ram,#panel .qb{
  background:linear-gradient(135deg,rgba(255,255,255,.25) 0%,rgba(255,255,255,.05) 46%,rgba(255,255,255,.13) 100%);
  border:.1rem solid rgba(255,255,255,.42);
  box-shadow:inset 0 .18rem .3rem rgba(255,255,255,.7),inset 0 -.18rem .35rem rgba(255,255,255,.22),0 .8rem 2rem rgba(0,0,0,.3);
  -webkit-backdrop-filter:blur(.8rem) saturate(1.8) brightness(1.08);backdrop-filter:blur(.8rem) saturate(1.8) brightness(1.08);
  text-shadow:0 .1rem .5rem rgba(0,0,0,.35)}
#panel .card::before,#panel .rb::before{content:"";position:absolute;left:8%;right:8%;top:.15rem;height:38%;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
#panel .card,#panel .rb{position:relative}
#panel .f:focus{background:linear-gradient(135deg,rgba(255,255,255,.52),rgba(255,255,255,.18) 55%,rgba(255,255,255,.36))!important;color:#fff!important;transform:scale(1.04);
  box-shadow:inset 0 .2rem .35rem rgba(255,255,255,.95),inset 0 -.2rem .4rem rgba(255,255,255,.4),0 0 1.4rem rgba(255,255,255,.35),0 .9rem 2.2rem rgba(0,0,0,.35)}
#panel .f:focus svg{stroke:#fff}
#panel .f:focus.card small{color:rgba(255,255,255,.88)}
#panel .card .ci{background:rgba(255,255,255,.2);box-shadow:inset 0 .1rem .18rem rgba(255,255,255,.6)}
#panel .f:focus .ci{background:rgba(255,255,255,.34)}
#panel #pmedia img{box-shadow:0 .3rem .9rem rgba(0,0,0,.35)}
#qrow{grid-column:span 2;display:flex;gap:.9rem}
.qb{position:relative;flex:1;height:4.9rem;border-radius:1.5rem;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:600;transition:background .15s,transform .15s}
.qb img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}
.qb.icon img{position:static;width:3rem;height:3rem;border-radius:.7rem}
.qb.banner .ql,.qb.icon .ql{display:none}
.qb.dim{opacity:.45}
.qb::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 48%);pointer-events:none}
#cKeys{grid-column:span 2}

/* botones del control remoto */
#kso{position:fixed;top:0;right:0;bottom:0;left:0;z-index:15;background:transparent;visibility:hidden;opacity:0;transition:opacity .2s,visibility 0s .2s}
#kso.open{visibility:visible;opacity:1;transition:opacity .2s}
#ks{position:absolute;left:50%;top:50%;width:40rem;padding:1.2rem;border-radius:2.6rem;transform:translate(-50%,-50%);
  background:radial-gradient(120% 70% at 15% 0%,rgba(255,255,255,.30),rgba(255,255,255,0) 55%),linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.02) 50%,rgba(255,255,255,.10)),rgba(8,12,26,.22);
  border:.1rem solid rgba(255,255,255,.5);
  box-shadow:inset 0 .2rem .35rem rgba(255,255,255,.75),inset 0 -.2rem .4rem rgba(255,255,255,.3),0 1.4rem 3rem rgba(0,0,0,.35);
  -webkit-backdrop-filter:saturate(1.6) brightness(1.08);backdrop-filter:saturate(1.6) brightness(1.08)}
#ksH{font-size:1.15rem;color:rgba(255,255,255,.8);padding:0 .9rem .7rem;text-shadow:0 .1rem .4rem rgba(0,0,0,.45)}
.kv{margin-left:auto;font-size:1.05rem;opacity:.8}
#ksl.learning .ctxi{opacity:.45}

/* al abrir el centro de control, el inicio se atenúa para que el cristal se lea limpio */
#dock,#more,#np,#apptitle,#libbtn{transition-property:opacity,bottom,height}
body.panelopen #dock,body.panelopen #more,body.panelopen #libbtn{opacity:.18!important}
body.panelopen #np,body.panelopen #apptitle{opacity:0!important}
body.ksopen #panel{opacity:0!important;visibility:hidden!important}

/* los menús de cristal son transparentes: oculta lo de atrás para que no se encime */
body.ctxopen #np,body.ctxopen #apptitle,body.wxopen #np,body.wxopen #apptitle{opacity:0!important}
</style>
</head>

<script>
/* =====================================================================
   CONFIGURACIÓN  —  edita aquí lo que quieras cambiar
   ===================================================================== */
const CONFIG = {
  lang: 'es',                 // 'es' o 'en'
  hour12: false,              // true = 7:32 PM
  // Apps del dock: [paquete, nombre]. Si no está instalada, se omite.
  pinned: [
    ['com.google.android.youtube.tv', 'YouTube'],
    ['com.stremio.one',               'Stremio'],
    ['com.netflix.ninja',             'Netflix'],
    ['com.disney.disneyplus',         'Disney+'],
    ['com.spotify.tv.android',        'Spotify'],
    ['com.amazon.amazonvideo.livingroom', 'Prime Video'],
  ],
  storeApp: 'com.android.vending',        // botón "Tienda"
  musicApp: 'com.spotify.tv.android',     // botón "Escuchar"
  wallpaper: 'stars',                     // stars | drive | aurora | catnight | catrainbow | catxp | catmc
  city: 'La Paz',                         // ciudad para el clima (cámbiala)
  celsius: true
};

CONFIG.showMore = true;    // false = oculta la fila de apps secundarias bajo el dock

let lastMin = '';
function tick(){
  const d = new Date();
  const time = d.toLocaleTimeString(LOCALE, {hour:'numeric', minute:'2-digit', hour12:CONFIG.hour12}).replace(/\s?[ap]\.?\s?m\.?/i, m=>m.toUpperCase());
  if (time === lastMin) return; lastMin = time;
  let date = d.toLocaleDateString(LOCALE, {weekday:'long', day:'numeric', month:'long'});
  date = date.charAt(0).toUpperCase() + date.slice(1);
  $('time').textContent = time; $('date').textContent = date;
  $('bigtime').textContent = time; $('bigdate').textContent = date;
}

function wxIcon(code, day){
  if (code === 0 || code === 1) return day ? 'sun' : 'moonc';
  if (code === 2) return day ? 'partly' : 'cloud';
  if (code === 3) return 'cloud';
  if (code === 45 || code === 48) return 'fog';
  if (code >= 51 && code <= 67) return 'rain';
  if (code >= 71 && code <= 77) return 'snow';
  if (code >= 80 && code <= 82) return 'rain';

function closePanel(){ $('panel').classList.remove('open'); focusEl($('bPanel')); }

/* ---------- Información del sistema ---------- */
function refreshInfo(){
  const i = J(A.info()); if (!i) return;
  $('ssid').textContent = T.wifi;
  $('wifiSub').textContent = i.online ? (i.ssid || T.connected) : T.offline;
  $('ram').textContent = T.ramTxt(i.ramFree, i.storageFree) + (BUILD.indexOf('__') === 0 ? '' : ' · ' + BUILD);
}
setInterval(refreshInfo, 15000);

/* ---------- Música ---------- */
let lastArt = '';
const mmss = ms => { const s = Math.max(0, Math.floor(ms/1000)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
function pollMedia(){
  const m = J(A.media()); if (!m) return;
  const on = m.access && m.active;
  $('np').classList.toggle('hide', !on);
  if (on) {
    $('ttl').textContent = m.title; $('art2').textContent = m.artist;
    $('pTitle').textContent = m.title; $('pSub').textContent = m.artist;
    if (m.artKey !== lastArt) { lastArt = m.artKey; const a = A.mediaArt(); $('art').src = a || ''; $('pArt').src = a || ''; }
    $('ppIcon').innerHTML = svg(m.playing ? 'pause' : 'play');
    $('pos').textContent = mmss(m.pos);
    $('fill').style.width = (m.dur > 0 ? Math.min(100, m.pos / m.dur * 100) : 0) + '%';
    $('pArt').style.visibility = 'visible';
    if ($('plo').classList.contains('open')) updatePlayer(m);
  } else {
    $('pTitle').textContent = m.access ? T.nothing : T.enableMedia;
    $('pSub').textContent = '';
    $('pArt').removeAttribute('src'); $('pArt').style.visibility = 'hidden'; lastArt = '';
  }
}
setInterval(pollMedia, 1000);
$('pmedia').onclick = () => { const m = J(A.media()); if (m && !m.access) A.settings('notif'); else A.mediaCmd('toggle'); setTimeout(pollMedia, 300); };
document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => { A.mediaCmd(b.dataset.cmd); setTimeout(pollMedia, 300); });
/* ---------- Reproductor en cristal líquido ---------- */
let plKey = '', plPkg = '';
function updatePlayer(m){
  $('plTtl').textContent = m.title; $('plArtist').textContent = m.artist;
  $('plPos').textContent = mmss(m.pos); $('plDur').textContent = m.dur > 0 ? mmss(m.dur) : '';
  $('plFill').style.width = (m.dur > 0 ? Math.min(100, m.pos / m.dur * 100) : 0) + '%';
  $('plPP').innerHTML = svg(m.playing ? 'pause' : 'play');
  plPkg = m.pkg || CONFIG.musicApp;
  $('plOpenL').textContent = T.openApp((typeof labels !== 'undefined' && labels[plPkg]) || '');
  if (m.artKey !== plKey) {
    plKey = m.artKey;
    const a = $('art').getAttribute('src') || ''; $('plArt').src = a; $('plBg').src = a;
    loadQueue();
  }
}
function loadQueue(){
  let q = []; try { q = A.mediaQueue ? (J(A.mediaQueue()) || []) : []; } catch(e){}
  const box = $('plQ'); $('plQh').textContent = T.upNext;
  $('plQl').innerHTML = q.slice(0, 5).map((it, i) => '<div class="qi"><b>' + (i + 1) + '</b><span>' + esc(it.title) + '</span><small>' + esc(it.artist || '') + '</small></div>').join('');
  box.classList.toggle('hide', !q.length);
}
function openPlayer(){
  const m = J(A.media()); if (!m || !m.active) return;
  plKey = ''; updatePlayer(m);
  $('plo').classList.add('open'); focusEl($('plPPb'));
}
function closePlayer(noFocus){ $('plo').classList.remove('open'); if (!noFocus) focusEl($('bListen')); }
$('bListen').onclick = openPlayer;
$('plOpen').onclick = () => { closePlayer(true); A.launch(plPkg || CONFIG.musicApp); };
$('plo').onclick = e => { if (e.target === $('plo')) closePlayer(); };

/* ---------- Botones ---------- */
$('bStore').onclick = () => A.launch(CONFIG.storeApp);
$('bWifi').onclick  = () => A.settings('wifi');
$('bPanel').onclick = () => $('panel').classList.contains('open') ? closePanel() : openPanel();
$('bSet').onclick   = () => A.settings('main');
$('cWifi').onclick  = () => A.settings('wifi');
$('cAudio').onclick = () => A.settings('sound');
$('cClock').onclick = () => { $('panel').classList.remove('open'); $('big').classList.add('open'); };
$('cWall').onclick  = () => { wpIndex = (wpIndex + 1) % WALLPAPERS.length; applyWall(); };
$('rSearch').onclick  = () => A.settings('search');
$('rAccess').onclick  = () => A.settings('access');
$('rDisplay').onclick = () => A.settings('display');
$('rSet').onclick     = () => A.settings('main');
$('big').onclick = () => $('big').classList.remove('open');

/* =====================================================================
   Navegación con el control remoto (flechas + OK)
   ===================================================================== */
const visible = el => el.getClientRects().length > 0;
function scope(){
  if ($('plo').classList.contains('open')) return [...$('pl').querySelectorAll('.f')];
  if ($('kso').classList.contains('open')) return [...$('ksl').querySelectorAll('.f')];
  if ($('ctxo').classList.contains('open')) return [...$('ctx').querySelectorAll('.f')];
  if ($('wxo').classList.contains('open')) return [...$('wxdays').querySelectorAll('.f')];
  if ($('all').classList.contains('open')) return [...$('all').querySelectorAll('.f')];
  if ($('panel').classList.contains('open')) return [...$('panel').querySelectorAll('.f')].concat([$('bPanel')]);
  return [...document.querySelectorAll('.f')].filter(e => !e.closest('#panel') && !e.closest('#all') && !e.closest('#wxo') && !e.closest('#plo') && !e.closest('#ctxo') && !e.closest('#kso') && visible(e));
}
function focusEl(el){
  if (!el) return;
  el.focus({preventScroll:true});
  if (el.classList.contains('tile') || el.classList.contains('app'))
    el.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
}
function focusFirst(root){ focusEl((root || document).querySelector('.f')); }
function move(dir){
  const list = scope(), cur = document.activeElement;
  if (!cur || !list.includes(cur)) { focusEl(list.find(e => e.classList.contains('tile')) || list[0]); return; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  let best = null, bs = 1e12;
  for (const el of list) {
    if (el === cur) continue;
    const q = el.getBoundingClientRect(), dx = q.left + q.width/2 - cx, dy = q.top + q.height/2 - cy;
    let p, s;
    if (dir === 'ArrowRight') { if (dx <= 2) continue; p = dx; s = Math.abs(dy); }
    else if (dir === 'ArrowLeft') { if (dx >= -2) continue; p = -dx; s = Math.abs(dy); }
    else if (dir === 'ArrowDown') { if (dy <= 2) continue; p = dy; s = Math.abs(dx); }
    else { if (dy >= -2) continue; p = -dy; s = Math.abs(dx); }
    const score = p + s * 2.4;
    if (score < bs) { bs = score; best = el; }
  }
  if (best) focusEl(best);
}
function back(){
  if ($('plo').classList.contains('open')) return closePlayer();
  if ($('kso').classList.contains('open')) return learnId ? (stopLearn(), renderKeys(), focusEl($('ksl').firstChild)) : closeKeys();
  if ($('ctxo').classList.contains('open')) return closeCtx();
  if ($('wxo').classList.contains('open')) return closeWx();
  if ($('big').classList.contains('open')) return $('big').classList.remove('open');
  if ($('all').classList.contains('open')) { const m = allMode; closeAll(); return m ? focusTile(m) : focusEl($('libbtn')); }
  if ($('panel').classList.contains('open')) return closePanel();
  focusHome();
}
window.onBack = back;
window.onHome = () => { closePlayer(true); stopLearn(); $('kso').classList.remove('open'); away = false; exitSaver(); armIdle(); endMove(); closeCtx(true); $('wxo').classList.remove('open'); $('big').classList.remove('open'); closeAll(); $('panel').classList.remove('open'); focusHome(); };

addEventListener('keydown', e => {
  if ($('big').classList.contains('open')) { e.preventDefault(); $('big').classList.remove('open'); return; }
  if (e.key.startsWith('Arrow')) { e.preventDefault(); move(e.key); }
  else if (e.key === 'Escape' || e.key === 'GoBack' || e.key === 'BrowserBack' || e.key === 'Backspace') { e.preventDefault(); back(); }
  else if (e.key === 'MediaPlayPause') A.mediaCmd('toggle');
  else if (e.key === 'MediaTrackNext') A.mediaCmd('next');
  else if (e.key === 'MediaTrackPrevious') A.mediaCmd('prev');
});

$('saverHint').textContent = T.saverHint;
SAVER_IMGS.forEach(u => { const d = document.createElement('div'); d.className = 'sl'; d.innerHTML = '<div class="bg" style="background-image:url(' + u + ')"></div><img class="fr" alt="" src="' + u + '">'; $('saver').insertBefore(d, $('saverHint')); });
let saverOn = false, idleT = 0, slideT = 0, slideI = 0, away = false, lastAct = Date.now();
function showSlide(){ const s = $('saver').querySelectorAll('.sl'); s.forEach((e, k) => e.classList.toggle('cur', k === slideI)); slideI = (slideI + 1) % s.length; }
function startSaver(){
  if (saverOn || !SAVER_IMGS.length) return;
  if (away || document.visibilityState === 'hidden') return;                 // el launcher no está en pantalla (hay otra app abierta)
  const left = lastAct + CONFIG.saverMinutes * 60000 - Date.now();           // ¿de verdad pasaron los minutos desde la última vez que lo usaste?
  if (left > 1000) { clearTimeout(idleT); idleT = setTimeout(startSaver, left); return; }
  saverOn = true; slideI = Math.floor(Math.random() * SAVER_IMGS.length); showSlide();
  $('saver').classList.add('on'); slideT = setInterval(showSlide, 8000);
}
function exitSaver(){ if (!saverOn) return; saverOn = false; clearInterval(slideT); $('saver').classList.remove('on'); armIdle(); }
function armIdle(){ clearTimeout(idleT); lastAct = Date.now(); if (CONFIG.saverMinutes > 0 && !saverOn && !away) idleT = setTimeout(startSaver, CONFIG.saverMinutes * 60000); }
addEventListener('keydown', e => { if (saverOn) { e.preventDefault(); e.stopImmediatePropagation(); exitSaver(); } else armIdle(); }, true);
addEventListener('keyup', e => { if (saverOn) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
addEventListener('pointerdown', armIdle, true);
addEventListener('pointermove', () => { if (!saverOn) armIdle(); }, true);
$('saver').onclick = exitSaver;
/* el salvapantallas solo cuenta el tiempo mientras el launcher está en pantalla */
function leaveHome(){ away = true; clearTimeout(idleT); }
function backHome(){ away = false; exitSaver(); armIdle(); }
window.onPause = leaveHome; window.onResume = backHome;                      // avisos desde Android
document.addEventListener('visibilitychange', () => document.visibilityState === 'hidden' ? leaveHome() : backHome());
addEventListener('blur', leaveHome); addEventListener('focus', backHome);
armIdle();

/* ---------- Mantener OK presionado + modo mover ---------- */
const isOK = e => e.key === 'Enter' || e.keyCode === 13 || e.keyCode === 23;
let lpT = null, holdGuard = false, lastOK = 0;
addEventListener('keydown', e => {
  if (moving) {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight') { e.preventDefault(); e.stopImmediatePropagation(); moveStep(k === 'ArrowLeft' ? -1 : 1); }
    else if (k === 'ArrowUp' || k === 'ArrowDown') { e.preventDefault(); e.stopImmediatePropagation(); moveRow(k === 'ArrowDown'); }
    else if (isOK(e) || k === 'Escape' || k === 'GoBack' || k === 'BrowserBack' || k === 'Backspace') { e.preventDefault(); e.stopImmediatePropagation(); endMove(); }
    return;
  }
  if (!isOK(e)) return;
  const nowOK = Date.now();
  if (holdGuard && nowOK - lastOK > 700) holdGuard = false;   // pausa larga = pulsación nueva
  lastOK = nowOK;
  if (holdGuard) { e.preventDefault(); e.stopImmediatePropagation(); return; }
  const t = document.activeElement;
  if (t && t.classList.contains('tile') && !$('ctxo').classList.contains('open')) {
    e.preventDefault(); e.stopImmediatePropagation();
    if (lpT === null) lpT = setTimeout(() => { lpT = null; holdGuard = true; openCtx(t); }, 550);
  }
}, true);
addEventListener('keyup', e => {
  if (!isOK(e)) return;
  if (holdGuard) { holdGuard = false; ctxT = Date.now(); e.preventDefault(); e.stopImmediatePropagation(); return; }
  if (lpT !== null) { clearTimeout(lpT); lpT = null; const t = document.activeElement; if (t && t.classList.contains('tile')) t.click(); }
}, true);

/* ---------- Liquid Blast: salpicadura líquida al cambiar de app ---------- */
let blast = null, blastRaf = 0;
function liquidBlast(el, big){
  if (blast) { blast.remove(); cancelAnimationFrame(blastRaf); }
  const col = 'rgb(' + colorFor(el).join(',') + ')', r = el.getBoundingClientRect(), w = r.width, h = r.height, S = Math.max(w, h) * 3.4;
  const box = blast = document.createElement('div'); box.className = 'blast'; box.style.width = box.style.height = S + 'px';
  const mk = (bw, bh, rad) => { const d = document.createElement('i'); d.style.cssText = 'width:' + bw + 'px;height:' + bh + 'px;left:' + (S - bw) / 2 + 'px;top:' + (S - bh) / 2 + 'px;border-radius:' + rad + 'px;background:' + col; box.appendChild(d); return d; };
  mk(w, h, h / 2).animate([{transform:'scale(.7)'}, {transform:'scale(1.35,1.6)', offset:.35}, {transform:'scale(1.05)'}], {duration:650, easing:'ease-out', fill:'forwards'});
  const n = big ? 14 : 9;
  for (let i = 0; i < n; i++) {
    const a = i / n * 6.283 + Math.random() * .5, sz = h * (.22 + Math.random() * .3), d = mk(sz, sz, sz / 2), dist = Math.max(w, h) * (.55 + Math.random() * .45);
    d.animate([{transform:'translate(0,0) scale(1)'}, {transform:'translate(' + Math.cos(a) * dist + 'px,' + Math.sin(a) * dist * .8 + 'px) scale(.25)'}], {duration:520 + Math.random() * 220, easing:'cubic-bezier(.15,.8,.3,1)', fill:'forwards'});
  }
  box.animate([{opacity:.85}, {opacity:.85, offset:.45}, {opacity:0}], {duration:720, fill:'forwards'});
  document.body.appendChild(box);
  const t0 = performance.now();
  (function f(){
    const q = el.getBoundingClientRect(); box.style.transform = 'translate(' + (q.left + q.width / 2 - S / 2) + 'px,' + (q.top + q.height / 2 - S / 2) + 'px)';
    if (performance.now() - t0 < 720) blastRaf = requestAnimationFrame(f); else { box.remove(); if (blast === box) blast = null; }
  })();
}

/* ---------- Destello del color de la app ---------- */
const colorCache = {};
function dominantColor(img){
  try {
    const c = document.createElement('canvas'); c.width = c.height = 24;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0, 24, 24);
    const d = g.getImageData(0, 0, 24, 24).data;
    let r=0, gg=0, b=0, w=0;
    for (let i=0;i<d.length;i+=4){
      if (d[i+3] < 128) continue;
      const mx=Math.max(d[i],d[i+1],d[i+2]), mn=Math.min(d[i],d[i+1],d[i+2]);
      const sat = mx ? (mx-mn)/mx : 0;
      if (mx < 50 || sat < .25) continue;           // ignora negro, blanco y grises
      const wt = sat*sat*(mx/255);
      r+=d[i]*wt; gg+=d[i+1]*wt; b+=d[i+2]*wt; w+=wt;
    }
    if (w > 0) return [Math.round(r/w), Math.round(gg/w), Math.round(b/w)];
  } catch(e){}
  return null;
}
function hashColor(str){
  let h = 0; for (const ch of str) h = (h*31 + ch.charCodeAt(0)) % 360;
  const f = (n)=>{ const k=(n+h/30)%12; return Math.round(255*(.62 - .38*Math.max(-1, Math.min(k-3, 9-k, 1)))); };
  return [f(0), f(8), f(4)];
}
function colorFor(el){
  const key = el.dataset.pkg || el.textContent;
  if (colorCache[key]) return colorCache[key];
  const img = el.querySelector('img');
  let col = (img && img.complete && img.naturalWidth) ? dominantColor(img) : null;
  if (!col) return hashColor(key);
  return colorCache[key] = col;
}
const gls = [$('glow'), $('glow2')]; let gcur = 0;
function glowOff(){ gls.forEach(g => g.classList.remove('on')); }
function glowFor(el){
  if (!el || !(el.classList.contains('tile') || el.classList.contains('app')) || el.classList.contains('allapps')) { glowOff(); return; }
  const col = colorFor(el), r = el.getBoundingClientRect();
  el.style.setProperty('--tc', col.join(','));
  gcur ^= 1; const g = gls[gcur], o = gls[gcur ^ 1];
  g.style.setProperty('--gc', col.join(','));
  g.style.setProperty('--gx', Math.round((r.left + r.width/2) / innerWidth * 100) + '%');
  g.classList.add('on'); o.classList.remove('on');
  g.classList.remove('flash'); void g.offsetWidth; g.classList.add('flash');
}

/* ---------- Selector de cristal: se desliza y se estira entre apps ---------- */
let REM = parseFloat(getComputedStyle(document.documentElement).fontSize); addEventListener('resize', () => REM = parseFloat(getComputedStyle(document.documentElement).fontSize));
let lensT = null, lensEl = null, lensS = null, lensRaf = 0;
const tr = t => ({l:t.offsetLeft, r:t.offsetLeft + t.offsetWidth, t:t.offsetTop, b:t.offsetTop + t.offsetHeight});
function hideLens(){ lensT = null; lensEl = null; $('lens1').classList.remove('on'); $('lens2').classList.remove('on'); }
function moveLens(t){
  const L = $(t.classList.contains('mini') ? 'lens2' : 'lens1');
  const first = lensEl !== L || !L.classList.contains('on');
  if (lensEl && lensEl !== L) lensEl.classList.remove('on');
  lensT = t; lensEl = L; L.style.setProperty('--tc', t.style.getPropertyValue('--tc') || '255,255,255');
  if (first) lensS = tr(t);
  L.classList.add('on');
  if (!lensRaf) lensRaf = requestAnimationFrame(lensStep);
}
function lensStep(){
  lensRaf = 0; if (!lensT || !lensEl) return;
  const q = tr(lensT), s = lensS, right = (q.l + q.r) / 2 >= (s.l + s.r) / 2, F = .34, S = .15, pad = .35 * REM;
  s.l += (q.l - s.l) * (right ? S : F); s.r += (q.r - s.r) * (right ? F : S);   // borde delantero rápido, trasero lento = se estira
  s.t += (q.t - s.t) * .3; s.b += (q.b - s.b) * .3;
  const st = lensEl.style; st.left = (s.l - pad) + 'px'; st.top = (s.t - pad) + 'px'; st.width = (s.r - s.l + 2 * pad) + 'px'; st.height = (s.b - s.t + 2 * pad) + 'px';
  if (Math.max(Math.abs(q.l - s.l), Math.abs(q.r - s.r), Math.abs(q.t - s.t), Math.abs(q.b - s.b)) > .4) lensRaf = requestAnimationFrame(lensStep);
}
document.addEventListener('focusin', e => {
  glowFor(e.target);
  const t = e.target;
  document.body.classList.toggle('minifocus', !!(t.classList && t.classList.contains('mini')));
  if (t.classList && t.classList.contains('tile')) { showAppTitle(t); if (!moving) liquidBlast(t); moveLens(t); } else { hideAppTitle(); hideLens(); }
});
document.addEventListener('focusout', e => { if (!e.relatedTarget) { glowOff(); hideLens(); hideAppTitle(); document.body.classList.remove('minifocus'); } });

/* ---------- Inicio ---------- */
paintIcons();
buildDock(); refreshInfo(); pollMedia();
try { if (!Object.keys(qkeys).length && !localStorage.getItem('keysHint')) { localStorage.setItem('keysHint', '1'); setTimeout(() => toast(K.firstRun, 7000), 2500); } } catch(e){}
focusHome();
