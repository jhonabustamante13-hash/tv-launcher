<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Launcher</title>
<style>
:root{
  --glass:rgba(255,255,255,.10);
  --glass2:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.18);
  --txt:#f4f6fb;
  --dim:rgba(244,246,251,.62);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* 1rem = 20px en una TV de 1920px de ancho; todo escala solo */
html{font-size:calc(100vw / 96)}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--txt);
  font-family:"Google Sans","Product Sans",Roboto,"Segoe UI",Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;outline:none;cursor:pointer}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}

/* ---------- Fondo ---------- */
#wall{position:fixed;inset:0;overflow:hidden;transition:opacity .4s}
#wall>*{position:absolute;inset:0}
#stars,#scene,#drive,#aurora{display:none}
.wp-drive #drive{display:block}
.wp-aurora #aurora{display:block}
.wp-stars{background:linear-gradient(180deg,#05060b 0%,#0a0f1d 55%,#101a30 100%)}
.wp-drive{background:linear-gradient(180deg,#0c0420 0%,#2a0b52 45%,#ff2e88 70%,#ff9a3c 72%,#0a0318 72.2%)}
.wp-aurora{background:#050a14}
#scene svg{position:absolute;left:0;top:0;width:100%;height:100%;stroke:none}
#glow{opacity:0;transition:opacity .5s;--gc:120,140,255;--gx:50%;pointer-events:none;
  background:radial-gradient(130rem 90rem at var(--gx) 75%,rgba(var(--gc),.42),rgba(var(--gc),.20) 55%,rgba(var(--gc),.10) 100%),
             linear-gradient(180deg,rgba(var(--gc),.08),rgba(var(--gc),.08))}
#glow.on{opacity:1}
#glow.flash{animation:flash .9s ease-out}
@keyframes flash{0%{filter:brightness(1.7) saturate(1.3)}35%{filter:brightness(1.25)}100%{filter:none}}
#shade{position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
/* synthwave */
#drive .sun{position:absolute;left:50%;top:34%;width:20rem;height:20rem;margin-left:-10rem;border-radius:50%;
  background:linear-gradient(180deg,#ffe36b,#ff3d8f);filter:blur(.15rem)}
#drive .grid{position:absolute;left:-50%;right:-50%;top:72%;bottom:-40%;
  background-image:linear-gradient(rgba(255,60,200,.85) .12rem,transparent .12rem),
                   linear-gradient(90deg,rgba(255,60,200,.85) .12rem,transparent .12rem);
  background-size:4rem 4rem;transform:perspective(30rem) rotateX(62deg);transform-origin:top center}
#drive .glow{position:absolute;left:0;right:0;top:60%;height:20%;background:linear-gradient(180deg,transparent,rgba(0,220,255,.25),transparent)}
/* aurora */
#aurora i{position:absolute;border-radius:50%;filter:blur(7rem);opacity:.75;animation:drift 18s ease-in-out infinite alternate}
#aurora i:nth-child(1){width:46rem;height:30rem;left:-6rem;top:8rem;background:#1fd5a4}
#aurora i:nth-child(2){width:40rem;height:34rem;right:-4rem;top:-4rem;background:#5a4bff;animation-delay:-6s}
#aurora i:nth-child(3){width:36rem;height:26rem;left:34rem;bottom:-6rem;background:#00a6ff;animation-delay:-11s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(4rem,-3rem,0) scale(1.18)}}

/* ---------- Cabecera ---------- */
#top{position:fixed;left:5rem;right:5rem;top:3.2rem;display:flex;align-items:center;justify-content:space-between;z-index:5}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.07) 45%,rgba(255,255,255,.14) 100%);
  border:.08rem solid rgba(255,255,255,.34);
  box-shadow:inset 0 .12rem .25rem rgba(255,255,255,.55),inset 0 -.15rem .35rem rgba(255,255,255,.12),0 .8rem 2.2rem rgba(0,0,0,.28);
  -webkit-backdrop-filter:blur(1.4rem) saturate(1.7);backdrop-filter:blur(1.4rem) saturate(1.7)}
#clock{display:flex;align-items:center;gap:1.5rem;padding:.9rem 2rem .9rem 1.8rem;border-radius:2.6rem;text-shadow:0 .1rem .5rem rgba(0,0,0,.35)}
#clock .ct{display:flex;flex-direction:column;line-height:1.05}
#time{font-size:2.9rem;font-weight:600;letter-spacing:.02rem}
#date{font-size:1.1rem;font-weight:400;color:rgba(255,255,255,.78);margin-top:.25rem}
#left{display:flex;align-items:center;gap:1.2rem}
#wx{display:flex;align-items:center;gap:1rem;padding:.9rem 2rem .9rem 1.6rem;border-radius:2.6rem;text-shadow:0 .1rem .5rem rgba(0,0,0,.35)}
#wx.hide{display:none}
#wxi{font-size:3rem;display:flex}
#wxi svg{stroke-width:1.5}
#wx .wt{display:flex;flex-direction:column;line-height:1.05}
#wxt{font-size:2.2rem;font-weight:500}
#wxc{font-size:1rem;color:rgba(255,255,255,.78);margin-top:.2rem}
#pills{display:flex;gap:1.8rem}
#bPanel{margin:0 .8rem}
.pill{display:flex;align-items:center;gap:.7rem;height:3.4rem;padding:0 1.5rem;border-radius:2rem;
  background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.07) 50%,rgba(255,255,255,.14));border:.08rem solid rgba(255,255,255,.34);
  box-shadow:inset 0 .1rem .2rem rgba(255,255,255,.5),0 .5rem 1.4rem rgba(0,0,0,.25);-webkit-backdrop-filter:blur(1.2rem) saturate(1.6);backdrop-filter:blur(1.2rem) saturate(1.6);font-size:1.3rem;font-weight:500;
  transition:background .15s,transform .15s,color .15s}
.pill.round{width:3.4rem;padding:0;justify-content:center;font-size:1.6rem}
.pill svg{font-size:1.5rem}

#clock{text-align:left;cursor:pointer;transition:background .15s,transform .15s,color .15s}
#clock:focus #date{color:#4a5060;text-shadow:none}
#clock:focus .ct{text-shadow:none}

/* ---------- Tarjeta del clima (al presionar la fecha/hora) ---------- */
#wxo{position:fixed;inset:0;z-index:12;background:rgba(0,0,0,.38);-webkit-backdrop-filter:blur(.5rem);backdrop-filter:blur(.5rem);
  display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:opacity .25s,visibility 0s .25s}
#wxo.open{visibility:visible;opacity:1;transition:opacity .25s}
#wxcard{width:62rem;padding:3rem 3.4rem 2.6rem;border-radius:3.2rem;color:#fff;text-shadow:0 .1rem .6rem rgba(0,0,0,.3);
  transform:scale(.94) translateY(1.5rem);transition:transform .3s cubic-bezier(.2,.9,.3,1.1);
  background:linear-gradient(135deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,.08) 45%,rgba(255,255,255,.18) 100%);
  -webkit-backdrop-filter:blur(2.2rem) saturate(1.8);backdrop-filter:blur(2.2rem) saturate(1.8)}
#wxo.open #wxcard{transform:none}
#wxcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:2rem}
#wxd{font-size:1.5rem;font-weight:500;letter-spacing:.05rem;opacity:.95}
#wxbig{display:flex;align-items:flex-start;line-height:1;margin-top:1rem}
#wxbig b{font-size:9.2rem;font-weight:500;letter-spacing:-.3rem}
#wxbig span{font-size:6.2rem;font-weight:200;margin:.2rem 0 0 .2rem;opacity:.9}
#wxcard .right{padding-top:.4rem;min-width:19rem}
#wxci{font-size:3.4rem;display:flex}
#wxci svg{stroke-width:1.4}
#wxfeel{font-size:1.5rem;margin:1rem 0 1.2rem}
#wxcond{font-size:1.2rem;opacity:.8;margin:-.8rem 0 1.2rem}
#wxhl{display:flex;gap:.9rem}
#wxhl i{font-style:normal;font-size:1.5rem;font-weight:500;padding:.6rem 1.2rem;border-radius:1.2rem;background:rgba(0,0,0,.2);border:.06rem solid rgba(255,255,255,.18)}
#wxdays{display:flex;justify-content:space-between;margin-top:2.2rem}
.dchip{min-width:6.6rem;padding:.9rem 1rem;border-radius:1.4rem;font-family:"SF Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;font-size:1.4rem;letter-spacing:.12rem;text-align:center;text-transform:uppercase;transition:background .15s,transform .15s,color .15s}
.dchip.sel{background:rgba(255,255,255,.28)}
.dchip.f:focus{text-shadow:none}
#wxnone{font-size:1.4rem;opacity:.8;text-align:center;padding:1rem 0}

/* ---------- Foco ---------- */
.f:focus{background:#fff!important;color:#10131c!important;transform:scale(1.05);z-index:3}
.f:focus svg{stroke:#10131c}
.f:focus .fillicon{fill:#10131c}

/* ---------- Música (home) ---------- */
#np{position:fixed;left:5rem;right:5rem;bottom:30.8rem;z-index:4;transition:opacity .25s}
body.apptitle #np{opacity:0;pointer-events:none}
#np .row{display:flex;gap:2rem;align-items:flex-end}
#art{width:8.4rem;height:8.4rem;border-radius:1rem;object-fit:cover;background:var(--glass2);box-shadow:0 .5rem 1.6rem rgba(0,0,0,.45)}
#np .meta{flex:1;min-width:0}
#ttl{font-size:2.5rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 .1rem .8rem rgba(0,0,0,.5)}
#art2{font-size:1.3rem;color:var(--dim);margin:.2rem 0 .9rem}
.ctl{display:flex;gap:1rem;align-items:center}
.cb{width:3.2rem;height:3.2rem;border-radius:50%;border:.1rem solid var(--line);background:var(--glass);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.cb svg{stroke:none;fill:currentColor}
.f:focus.cb svg{fill:#10131c}
.listen{display:flex;align-items:center;gap:.7rem;height:3.4rem;padding:0 1.8rem;border-radius:2rem;background:#fff;color:#10131c;font-size:1.25rem;font-weight:500}
.listen svg{stroke:#10131c}
.listen:focus{box-shadow:0 0 0 .3rem rgba(255,255,255,.55)}
#bar{display:flex;align-items:center;gap:1rem;margin-top:1.4rem;font-size:1.1rem;color:var(--dim)}
#bar .trk{flex:1;height:.28rem;border-radius:.2rem;background:rgba(255,255,255,.25);overflow:hidden}
#bar .trk i{display:block;height:100%;width:0;background:#fff}

/* ---------- Dock de apps ---------- */
#dock{position:fixed;left:5rem;right:5rem;bottom:15.6rem;height:14rem;border-radius:2.4rem;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));border:.08rem solid var(--line);
  overflow:hidden;z-index:4}
#row{display:flex;align-items:center;gap:1.4rem;height:100%;padding:0 1.8rem;width:max-content}
.tile{position:relative;flex:none;width:12.5rem;height:7rem;border-radius:1.3rem;overflow:hidden;
  background:rgba(20,24,40,.85);border:.08rem solid var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.4rem;transition:width .22s,height .22s,transform .22s}
.tile img{display:block}
.tile.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.icon img{width:3.6rem;height:3.6rem;border-radius:.8rem}
.tile .tl{font-size:1.05rem;font-weight:500;padding:0 .6rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile.banner .tl{display:none}
.tile.f:focus{width:19rem;height:10.7rem;transform:none;background:rgba(20,24,40,.96)!important;color:#fff!important;
  border-color:rgb(var(--tc,255,255,255));
  box-shadow:0 0 0 .2rem rgba(8,12,24,.92),0 0 0 .42rem rgb(var(--tc,255,255,255)),0 0 1.2rem .3rem rgba(var(--tc,255,255,255),.6)}
.tile.f:focus .tl{color:#fff}
.tile{--tc:255,255,255}
.tile.allapps{width:7rem}
.tile.allapps:focus{width:9rem}
.tile.allapps svg{font-size:2.4rem}

/* título de la app seleccionada */
#apptitle{position:fixed;left:5rem;right:5rem;bottom:30.8rem;z-index:4;opacity:0;pointer-events:none;transition:opacity .25s;text-shadow:0 .1rem .9rem rgba(0,0,0,.55)}
body.apptitle #apptitle{opacity:1}
#apptitle .at{font-size:6rem;font-weight:500;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.05rem}
#apptitle .as{font-size:1.5rem;color:var(--dim);margin-top:.8rem}
#apptitle .as b{color:#fff;font-weight:500}
#apptitle .dots{display:flex;gap:.8rem;align-items:center;margin-top:1.8rem;height:1rem}
#apptitle .dots i{width:.9rem;height:.9rem;border-radius:50%;background:rgba(255,255,255,.38);transition:width .2s,background .2s}
#apptitle .dots i.on{width:3.8rem;border-radius:.5rem;background:#fff}
#apptitle.pop .at,#apptitle.pop .as{animation:pop .3s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(.8rem)}to{opacity:1;transform:none}}

/* fila de las demás apps + botón de biblioteca */
#more{position:fixed;left:5rem;right:5rem;bottom:5.8rem;height:8.6rem;border-radius:2rem;overflow:hidden;z-index:4;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border:.08rem solid var(--line)}
#mnone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.25rem;color:var(--dim)}
#mrow{display:flex;align-items:center;gap:1.1rem;height:100%;padding:0 1.4rem;width:max-content}
.tile.mini{width:9.4rem;height:5.6rem;border-radius:1.1rem;gap:.2rem}
.tile.mini.icon img{width:2.7rem;height:2.7rem;border-radius:.6rem}
.tile.mini .tl{font-size:.95rem}
.tile.mini.f:focus{width:11.2rem;height:6.7rem;box-shadow:0 0 0 .15rem rgba(8,12,24,.92),0 0 0 .3rem rgb(var(--tc,255,255,255)),0 0 .5rem .3rem rgba(var(--tc,255,255,255),.5)}
#libbtn{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:1.5rem;z-index:4;height:3.6rem;padding:0 2.6rem;font-size:1.4rem;border-radius:2.2rem}
#libbtn svg{font-size:1.6rem}

/* ---------- Panel de control ---------- */
#panel{position:fixed;right:5rem;top:8.4rem;width:34rem;z-index:8;visibility:hidden;opacity:0;
  transform:translateX(2.5rem);transition:opacity .2s,transform .2s,visibility 0s .2s}
#panel.open{visibility:visible;opacity:1;transform:none;transition:opacity .2s,transform .2s}
#grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:4.9rem;gap:1.3rem}
.card{border-radius:1.8rem;background:rgba(40,46,64,.78);border:.08rem solid var(--line);padding:1rem 1.3rem;
  display:flex;align-items:center;gap:1rem;text-align:left;transition:background .15s,transform .15s}
.card .ci{width:2.9rem;height:2.9rem;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex:none}
.card .ct{min-width:0}
.card b{display:block;font-size:1.25rem;font-weight:600}
.card small{display:block;font-size:1.05rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f:focus.card small{color:#4a5060}
.f:focus .ci{background:rgba(0,0,0,.1)}
#pmedia{grid-row:span 2;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:1.1rem}
#pmedia img{width:3.8rem;height:3.8rem;border-radius:.7rem;background:var(--glass2);object-fit:cover}
#pmedia .pm-b{width:100%}
#pmedia .pm-b b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.2rem}
#prow{grid-column:span 2;display:flex;justify-content:space-between;padding:.3rem .2rem}
.rb{width:4.7rem;height:4.7rem;border-radius:50%;background:rgba(40,46,64,.78);border:.08rem solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.8rem}
#ram{margin:1.2rem 0 0;padding:.7rem 1.4rem;border-radius:1.4rem;background:rgba(40,46,64,.78);border:.08rem solid var(--line);font-size:1.05rem;color:var(--dim);text-align:right}

/* ---------- Todas las apps ---------- */
#all{position:fixed;inset:0;z-index:9;background:rgba(5,8,16,.9);padding:6rem 5rem 3rem;visibility:hidden;opacity:0;transition:opacity .2s,visibility 0s .2s}
#all.open{visibility:visible;opacity:1;transition:opacity .2s}
#all h2{font-size:2rem;font-weight:600;margin-bottom:2rem}
#allH{font-size:1.25rem;color:var(--dim);margin:-1.2rem 0 1.8rem}
#apps{display:grid;grid-template-columns:repeat(8,1fr);gap:1.6rem;max-height:calc(100vh - 21rem);overflow-y:auto;overflow-x:hidden;padding:.5rem;margin:-.5rem;scrollbar-width:none}
#apps::-webkit-scrollbar{display:none}
.app{position:relative}
.app .pin{position:absolute;top:.6rem;right:.6rem;width:2.1rem;height:2.1rem;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.app .pin svg{stroke:#fff!important;stroke-width:2.4}
.app .pin .ck{display:none}
.app.pinned .pin{background:#22b55e}
.app.pinned .pin .ck{display:flex}
.app.pinned .pin .pl{display:none}
.app .pin span{display:flex}
.app{display:flex;flex-direction:column;align-items:center;gap:.8rem;padding:1.3rem .6rem;border-radius:1.4rem;background:var(--glass);font-size:1.1rem;transition:transform .15s}
.app img{width:5.4rem;height:5.4rem;border-radius:1.1rem;object-fit:cover}
.app span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .ph{width:5.4rem;height:5.4rem;border-radius:1.1rem;background:var(--glass2)}

/* ---------- Reloj grande ---------- */
#big{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 40%,rgba(10,16,34,.55),rgba(0,0,0,.92));display:none;align-items:center;justify-content:center;flex-direction:column}
#big.open{display:flex}
#bigtime{font-size:15rem;font-weight:300;letter-spacing:.2rem}
#bigdate{font-size:2.2rem;color:var(--dim);margin-top:.5rem}

#toast{position:fixed;left:50%;bottom:2rem;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:.7rem 1.6rem;border-radius:1.4rem;font-size:1.1rem;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>

<div id="wall" class="wp-stars">
  <div id="drive"><div class="sun"></div><div class="glow"></div><div class="grid"></div></div>
  <div id="aurora"><i></i><i></i><i></i></div>
  <div id="glow"></div>
</div>
<div id="shade"></div>

<header id="top">
  <div id="left">
    <button id="clock" class="glass f"><div class="ct"><span id="time"></span><span id="date"></span></div></button>
    <div id="wx" class="glass hide"><span id="wxi"></span><div class="wt"><b id="wxt"></b><span id="wxc"></span></div></div>
  </div>
  <nav id="pills">
    <button class="pill f" id="bStore"><span data-i="store"></span><span id="lStore"></span></button>
    <button class="pill f" id="bWifi"><span data-i="wifi"></span><span id="ssid"></span></button>
    <button class="pill round f" id="bPanel"><span data-i="toggle"></span></button>
    <button class="pill round f" id="bSet"><span data-i="gear"></span></button>
  </nav>
</header>

<section id="apptitle"><div class="at" id="atName"></div><div class="as" id="atSub"></div><div class="dots" id="atDots"></div></section>

<section id="np" class="hide">
  <div class="row">
    <img id="art" alt="">
    <div class="meta">
      <div id="ttl"></div>
      <div id="art2"></div>
      <div class="ctl">
        <button class="cb f" data-cmd="prev"><span data-i="prev"></span></button>
        <button class="cb f" data-cmd="toggle"><span id="ppIcon"></span></button>
        <button class="cb f" data-cmd="next"><span data-i="next"></span></button>
        <button class="listen f" id="bListen"><span data-i="headphones"></span><span id="lListen"></span></button>
      </div>
    </div>
  </div>
  <div id="bar"><span id="pos">0:00</span><div class="trk"><i id="fill"></i></div></div>
</section>

<section id="dock"><div id="row"></div></section>
<section id="more"><div id="mrow"></div><div id="mnone" class="hide"></div></section>
<button id="libbtn" class="pill f"><span data-i="grid"></span><span id="lLib"></span></button>

<aside id="panel">
  <div id="grid">
    <button class="card f" id="pmedia">
      <img id="pArt" alt="">
      <div class="pm-b"><b id="pTitle"></b><small id="pSub"></small></div>
    </button>
    <button class="card f" id="cWifi"><span class="ci" data-i="wifi"></span><span class="ct"><b>Wi-Fi</b><small id="wifiSub"></small></span></button>
    <button class="card f" id="cAudio"><span class="ci" data-i="speaker"></span><span class="ct"><b>Audio</b><small id="audioSub"></small></span></button>
    <button class="card f" id="cClock"><span class="ci" data-i="moon"></span><span class="ct"><b id="tClock"></b><small id="sClock"></small></span></button>
    <button class="card f" id="cWall"><span class="ci" data-i="image"></span><span class="ct"><b id="tWall"></b><small id="wallSub"></small></span></button>
    <div id="prow">
      <button class="rb f" id="rSearch"><span data-i="search"></span></button>
      <button class="rb f" id="rAccess"><span data-i="access"></span></button>
      <button class="rb f" id="rDisplay"><span data-i="display"></span></button>
      <button class="rb f" id="rSet"><span data-i="gear"></span></button>
    </div>
  </div>

/* ---------- Reloj ---------- */
let lastMin = '';
function tick(){

  date = date.charAt(0).toUpperCase() + date.slice(1);

setInterval(tick, 1000); tick();

/* ---------- Clima (Open-Meteo, gratis y sin clave) ---------- */
IC.sun='<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/>';
IC.cloud='<path d="M7 18a4 4 0 01-.5-8A5.5 5.5 0 0117 8.5 4.8 4.8 0 0117.5 18H7z"/>';
IC.partly='<circle cx="8.5" cy="8.5" r="3"/><path d="M8.5 2.5v1.5M2.5 8.5H4M4.3 4.3l1 1M12.7 4.3l-1 1"/><path d="M9 20a3.5 3.5 0 01-.3-7A4.8 4.8 0 0118 14a3.2 3.2 0 01-.5 6H9z"/>';
IC.rain='<path d="M7 15a4 4 0 01-.5-8A5.5 5.5 0 0117 5.5 4.8 4.8 0 0117.5 15H7z"/><path d="M8 18.5l-1 2.5M12 18.5l-1 2.5M16 18.5l-1 2.5"/>';
IC.snow='<path d="M7 15a4 4 0 01-.5-8A5.5 5.5 0 0117 5.5 4.8 4.8 0 0117.5 15H7z"/><path d="M8 19h.01M12 20.5h.01M16 19h.01M10 22h.01M14 22h.01"/>';
IC.storm='<path d="M7 14a4 4 0 01-.5-8A5.5 5.5 0 0117 4.5 4.8 4.8 0 0117.5 14H7z"/><path d="M12.5 14l-3 4.5h4l-2 4"/>';
IC.fog='<path d="M4 9h16M3 13h18M6 17h12"/>';
IC.moonc='<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>';
const WX = {es:{0:'Despejado',1:'Mayormente despejado',2:'Parcialmente nublado',3:'Nublado',45:'Niebla',48:'Niebla',51:'Llovizna',53:'Llovizna',55:'Llovizna',61:'Lluvia',63:'Lluvia',65:'Lluvia fuerte',71:'Nieve',73:'Nieve',75:'Nieve',80:'Chubascos',81:'Chubascos',82:'Chubascos',95:'Tormenta',96:'Tormenta',99:'Tormenta'},
            en:{0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',61:'Rain',63:'Rain',65:'Heavy rain',71:'Snow',73:'Snow',75:'Snow',80:'Showers',81:'Showers',82:'Showers',95:'Storm',96:'Storm',99:'Storm'}};
function wxIcon(code, day){
  if (code === 0 || code === 1) return day ? 'sun' : 'moonc';
  if (code === 2) return day ? 'partly' : 'cloud';
  if (code === 3) return 'cloud';
  if (code === 45 || code === 48) return 'fog';
  if (code >= 51 && code <= 67) return 'rain';
  if (code >= 71 && code <= 77) return 'snow';
  if (code >= 80 && code <= 82) return 'rain';
  if (code >= 95) return 'storm';
  return 'cloud';
}
let geo = null, wxData = null, wxSel = 0;
async function loadWeather(){
  try {
    if (!geo) {
      const g = await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name=' + encodeURIComponent(CONFIG.city))).json();
      if (!g.results || !g.results.length) return;
      geo = g.results[0];
    }
    const unit = CONFIG.celsius ? 'celsius' : 'fahrenheit';
    const w = await (await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + geo.latitude + '&longitude=' + geo.longitude +
              '&current=temperature_2m,apparent_temperature,weather_code,is_day' +
              '&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max&forecast_days=7&timezone=auto&temperature_unit=' + unit)).json();
    const c = w.current; if (!c) return;
    wxData = w; if ($('wxo').classList.contains('open')) { const had = document.activeElement && document.activeElement.classList.contains('dchip'); renderDays(); if (!had) { const f = $('wxdays').querySelector('.dchip'); if (f) focusEl(f); } }
    $('wxi').innerHTML = svg(wxIcon(c.weather_code, c.is_day === 1));
    $('wxt').textContent = Math.round(c.temperature_2m) + '°';
    $('wxc').textContent = (WX[CONFIG.lang] || WX.es)[c.weather_code] || '';
    $('wx').classList.remove('hide');
  } catch (e) { /* sin internet: el clima queda oculto */ }
}
loadWeather(); setInterval(loadWeather, 15 * 60 * 1000);

/* ---------- Tarjeta del clima ---------- */
const parseDay = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
function showDay(i){
  wxSel = i;
  const w = wxData; if (!w) return;
  const d = w.daily, c = w.current, today = i === 0;
  const dt = parseDay(d.time[i]);
  $('wxd').textContent = dt.toLocaleDateString(LOCALE, {weekday:'long', day:'numeric', month:'short', year:'numeric'});
  const main = today ? c.temperature_2m : d.temperature_2m_max[i];
  const feel = today ? c.apparent_temperature : d.apparent_temperature_max[i];
  const code = today ? c.weather_code : d.weather_code[i];
  $('wxn').textContent = Math.round(main) + '°';
  $('wxu').textContent = CONFIG.celsius ? 'C' : 'F';
  $('wxci').innerHTML = svg(wxIcon(code, today ? c.is_day === 1 : true));
  $('wxfeel').textContent = (CONFIG.lang === 'en' ? 'Feels like ' : 'Sensación ') + Math.round(feel) + '°';
  $('wxcond').textContent = (WX[CONFIG.lang] || WX.es)[code] || '';
  $('wxh').textContent = '↑ ' + Math.round(d.temperature_2m_max[i]) + '°';
  $('wxl').textContent = '↓ ' + Math.round(d.temperature_2m_min[i]) + '°';
  document.querySelectorAll('.dchip').forEach((b, k) => b.classList.toggle('sel', k === i));
}
function renderDays(){
  const box = $('wxdays'); box.innerHTML = '';
  if (!wxData) { box.innerHTML = '<div id="wxnone" style="width:100%">' + (CONFIG.lang === 'en' ? 'No weather data (check your connection)' : 'Sin datos del clima (revisa tu conexión)') + '</div>'; return; }
  wxData.daily.time.forEach((t, i) => {
    const b = document.createElement('button'); b.className = 'dchip f';
    b.textContent = parseDay(t).toLocaleDateString(LOCALE, {weekday:'short'}).replace('.', '');
    b.onfocus = () => showDay(i); b.onclick = () => showDay(i);
    box.appendChild(b);
  });
  showDay(Math.min(wxSel, wxData.daily.time.length - 1));
}
function openWx(){
  wxSel = 0; renderDays(); $('wxo').classList.add('open');
  const first = $('wxdays').querySelector('.dchip'); if (first) focusEl(first); else document.activeElement && document.activeElement.blur();
  loadWeather();
}
function closeWx(){ $('wxo').classList.remove('open'); focusEl($('clock')); }
$('clock').onclick = openWx;
$('wxo').onclick = e => { if (e.target === $('wxo')) closeWx(); };

/* ---------- Fondos ---------- */
let wpIndex = Math.max(0, WALLPAPERS.indexOf(CONFIG.wallpaper));
try { const s = localStorage.getItem('wp'); if (s && WALLPAPERS.includes(s)) wpIndex = WALLPAPERS.indexOf(s); } catch(e){}
function applyWall(){
  const k = WALLPAPERS[wpIndex];
  $('wall').className = 'wp-' + k;
  $('wallSub').textContent = T.wp[k];
  try { localStorage.setItem('wp', k); } catch(e){}
}
applyWall();

/* ---------- Apps / dock ---------- */
let installed = [];
const labels = {};
function loadIcon(el, pkg, big){
  setTimeout(() => {
    const r = J(A.icon(pkg));
    if (r && r.data) {
      const img = new Image(); img.src = r.data; img.alt = '';
      if (big) { el.classList.add(r.banner ? 'banner' : 'icon'); el.insertBefore(img, el.firstChild); }
      else { const ph = el.querySelector('.ph'); if (ph) ph.replaceWith(img); }
    }
  }, 0);
}
IC.check='<path d="M5 12.5l4.5 4.5L19 7.5"/>'; IC.plus='<path d="M12 5v14M5 12h14"/>';
const cfgName = {}; CONFIG.pinned.forEach(p => cfgName[p[0]] = p[1]);
let pinnedPk = null;
function getPinned(){
  if (pinnedPk) return pinnedPk;
  let st = null; try { st = JSON.parse(localStorage.getItem('pinnedApps')); } catch(e){}
  return pinnedPk = Array.isArray(st) ? st : CONFIG.pinned.map(p => p[0]);
}
function savePinned(){ try { localStorage.setItem('pinnedApps', JSON.stringify(pinnedPk)); } catch(e){} }
let lastOpen = {};
try { lastOpen = JSON.parse(localStorage.getItem('lastOpen')) || {}; } catch(e){}
function markOpen(pkg){ lastOpen[pkg] = Date.now(); try { localStorage.setItem('lastOpen', JSON.stringify(lastOpen)); } catch(e){} }
function whenText(ts){
  const d = new Date(ts), n = new Date();
  const t = d.toLocaleTimeString(LOCALE, {hour:'numeric', minute:'2-digit', hour12:true}).replace(/\s?([ap])\.?\s?m\.?/i, (m,x)=> CONFIG.lang==='en' ? ' '+x.toUpperCase()+'M' : ' '+x.toLowerCase()+'. m.');
  const day0 = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day0(n) - day0(d)) / 86400000);
  if (diff === 0) return T.today + ', ' + t;
  if (diff === 1) return T.yest + ', ' + t;
  return d.toLocaleDateString(LOCALE, {day:'numeric', month:'short'}).replace('.', '') + ', ' + t;
}
function showAppTitle(el){
  const pkg = el.dataset.pkg; if (!pkg) return;
  const box = $('apptitle');
  $('atName').textContent = cfgName[pkg] || labels[pkg] || pkg;
  $('atSub').innerHTML = lastOpen[pkg] ? esc(T.lastOpen) + ' <b>' + esc(whenText(lastOpen[pkg])) + '</b>' : esc(T.never);
  const sibs = [...el.parentNode.children].filter(x => x.classList.contains('tile')), n = sibs.length, idx = sibs.indexOf(el);
  const max = Math.min(n, 12), on = n <= 12 ? idx : Math.round(idx / Math.max(1, n - 1) * (max - 1));
  $('atDots').innerHTML = Array.from({length: max}, (_, k) => '<i' + (k === on ? ' class="on"' : '') + '></i>').join('');
  box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
  document.body.classList.add('apptitle');
}
function hideAppTitle(){ document.body.classList.remove('apptitle'); }
function mkTile(pkg, mini){
  const b = document.createElement('button');
  b.className = 'tile f' + (mini ? ' mini' : ''); b.dataset.pkg = pkg;
  b.innerHTML = '<span class="tl">' + esc(cfgName[pkg] || labels[pkg]) + '</span>';
  b.onclick = () => { markOpen(pkg); A.launch(pkg); };
  loadIcon(b, pkg, true); return b;
}
function buildDock(){
  installed = J(A.apps()) || [];
  installed.forEach(a => labels[a.pkg] = a.label);
  const pins = getPinned();
  const row = $('row'); row.innerHTML = '';
  pins.forEach(pkg => { if (labels[pkg]) row.appendChild(mkTile(pkg, false)); });
  const mrow = $('mrow'); mrow.innerHTML = '';
  installed.forEach(a => { if (!a.label) a.label = a.pkg; labels[a.pkg] = a.label; });
  installed.filter(a => a.pkg && !pins.includes(a.pkg)).sort((x, y) => String(x.label).localeCompare(String(y.label))).slice(0, 40)
    .forEach(a => { try { mrow.appendChild(mkTile(a.pkg, true)); } catch(e){} });
  $('mnone').textContent = installed.length ? T.noMore : T.noApps;
  $('mnone').classList.toggle('hide', mrow.children.length > 0);
}
function focusHome(){ focusEl($('row').querySelector('.f') || $('mrow').querySelector('.f') || $('libbtn')); }
function togglePin(pkg, el){
  const pins = getPinned(), i = pins.indexOf(pkg);
  if (i >= 0) pins.splice(i, 1); else pins.push(pkg);
  savePinned(); el.classList.toggle('pinned', i < 0);
  toast((i < 0 ? T.added : T.removed) + ' · ' + (cfgName[pkg] || labels[pkg]));
}
function openAll(){
  installed = J(A.apps()) || installed;
  installed.forEach(a => labels[a.pkg] = a.label);
  const pins = getPinned();
  const box = $('apps'); box.innerHTML = '';
  installed.slice().sort((a,b)=>a.label.localeCompare(b.label)).forEach(a => {
    const b = document.createElement('button'); b.className = 'app f' + (pins.includes(a.pkg) ? ' pinned' : '');
    b.dataset.pkg = a.pkg;
    b.innerHTML = '<div class="ph"></div><span>' + esc(a.label) + '</span><i class="pin"><span class="ck">' + svg('check') + '</span><span class="pl">' + svg('plus') + '</span></i>';
    b.onclick = () => togglePin(a.pkg, b);
    box.appendChild(b); loadIcon(b, a.pkg, false);
  });
  $('all').classList.add('open'); focusFirst($('all'));
}
function closeAll(){ if (!$('all').classList.contains('open')) return; $('all').classList.remove('open'); buildDock(); }
$('libbtn').onclick = openAll;

/* ---------- Panel ---------- */
function openPanel(){ $('panel').classList.add('open'); focusEl($('pmedia')); }
function closePanel(){ $('panel').classList.remove('open'); focusEl($('bPanel')); }

/* ---------- Información del sistema ---------- */
function refreshInfo(){
  const i = J(A.info()); if (!i) return;
  $('ssid').textContent = i.ssid || T.wifi;
  $('wifiSub').textContent = i.online ? (i.ssid || T.connected) : T.offline;
  $('ram').textContent = T.ramTxt(i.ramFree, i.storageFree);
}
setInterval(refreshInfo, 15000);

/* ---------- Música ---------- */
let lastArt = '';
const mmss = ms => { const s = Math.max(0, Math.floor(ms/1000)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
function pollMedia(){
  const m = J(A.media()); if (!m) return;
  const on = m.access && m.active;
  $('np').classList.toggle('hide', !on);
  if (on) {
    $('ttl').textContent = m.title; $('art2').textContent = m.artist;
    $('pTitle').textContent = m.title; $('pSub').textContent = m.artist;
    if (m.artKey !== lastArt) { lastArt = m.artKey; const a = A.mediaArt(); $('art').src = a || ''; $('pArt').src = a || ''; }
    $('ppIcon').innerHTML = svg(m.playing ? 'pause' : 'play');
    $('pos').textContent = mmss(m.pos);
    $('fill').style.width = (m.dur > 0 ? Math.min(100, m.pos / m.dur * 100) : 0) + '%';
    $('pArt').style.visibility = 'visible';
  } else {
    $('pTitle').textContent = m.access ? T.nothing : T.enableMedia;
    $('pSub').textContent = '';
    $('pArt').removeAttribute('src'); $('pArt').style.visibility = 'hidden'; lastArt = '';
  }
}
setInterval(pollMedia, 1000);

/* =====================================================================
   Navegación con el control remoto (flechas + OK)
   ===================================================================== */
const visible = el => el.getClientRects().length > 0;
function scope(){
  if ($('wxo').classList.contains('open')) return [...$('wxdays').querySelectorAll('.f')];
  if ($('all').classList.contains('open')) return [...$('all').querySelectorAll('.f')];
  if ($('panel').classList.contains('open')) return [...$('panel').querySelectorAll('.f')].concat([$('bPanel')]);
  return [...document.querySelectorAll('.f')].filter(e => !e.closest('#panel') && !e.closest('#all') && !e.closest('#wxo') && visible(e));
}
function focusEl(el){
  if (!el) return;
  el.focus({preventScroll:true});
  if (el.classList.contains('tile') || el.classList.contains('app'))
    el.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
}
function focusFirst(root){ focusEl((root || document).querySelector('.f')); }
function move(dir){
  const list = scope(), cur = document.activeElement;
  if (!cur || !list.includes(cur)) { focusEl(list.find(e => e.classList.contains('tile')) || list[0]); return; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  let best = null, bs = 1e12;
  for (const el of list) {
    if (el === cur) continue;
    const q = el.getBoundingClientRect(), dx = q.left + q.width/2 - cx, dy = q.top + q.height/2 - cy;
    let p, s;
    if (dir === 'ArrowRight') { if (dx <= 2) continue; p = dx; s = Math.abs(dy); }
    else if (dir === 'ArrowLeft') { if (dx >= -2) continue; p = -dx; s = Math.abs(dy); }
    else if (dir === 'ArrowDown') { if (dy <= 2) continue; p = dy; s = Math.abs(dx); }
    else { if (dy >= -2) continue; p = -dy; s = Math.abs(dx); }
    const score = p + s * 2.4;
    if (score < bs) { bs = score; best = el; }
  }
  if (best) focusEl(best);
}
function back(){
  if ($('wxo').classList.contains('open')) return closeWx();
  if ($('big').classList.contains('open')) return $('big').classList.remove('open');
  if ($('all').classList.contains('open')) { closeAll(); return focusEl($('libbtn')); }
  if ($('panel').classList.contains('open')) return closePanel();
  focusHome();
}
window.onBack = back;
window.onHome = () => { $('wxo').classList.remove('open'); $('big').classList.remove('open'); closeAll(); $('panel').classList.remove('open'); focusHome(); };

addEventListener('keydown', e => {
  if ($('big').classList.contains('open')) { e.preventDefault(); $('big').classList.remove('open'); return; }
  if (e.key.startsWith('Arrow')) { e.preventDefault(); move(e.key); }
  else if (e.key === 'Escape' || e.key === 'GoBack' || e.key === 'BrowserBack' || e.key === 'Backspace') { e.preventDefault(); back(); }
  else if (e.key === 'MediaPlayPause') A.mediaCmd('toggle');
  else if (e.key === 'MediaTrackNext') A.mediaCmd('next');
  else if (e.key === 'MediaTrackPrevious') A.mediaCmd('prev');
});

/* ---------- Destello del color de la app ---------- */
const colorCache = {};
function dominantColor(img){
  try {
    const c = document.createElement('canvas'); c.width = c.height = 24;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0, 24, 24);
    const d = g.getImageData(0, 0, 24, 24).data;
    let r=0, gg=0, b=0, w=0;
    for (let i=0;i<d.length;i+=4){
      if (d[i+3] < 128) continue;
      const mx=Math.max(d[i],d[i+1],d[i+2]), mn=Math.min(d[i],d[i+1],d[i+2]);
      const sat = mx ? (mx-mn)/mx : 0;
      if (mx < 50 || sat < .25) continue;           // ignora negro, blanco y grises
      const wt = sat*sat*(mx/255);
      r+=d[i]*wt; gg+=d[i+1]*wt; b+=d[i+2]*wt; w+=wt;
    }
    if (w > 0) return [Math.round(r/w), Math.round(gg/w), Math.round(b/w)];
  } catch(e){}
  return null;
}
function hashColor(str){
  let h = 0; for (const ch of str) h = (h*31 + ch.charCodeAt(0)) % 360;
  const f = (n)=>{ const k=(n+h/30)%12; return Math.round(255*(.62 - .38*Math.max(-1, Math.min(k-3, 9-k, 1)))); };
  return [f(0), f(8), f(4)];
}
function colorFor(el){
  const key = el.dataset.pkg || el.textContent;
  if (colorCache[key]) return colorCache[key];
  const img = el.querySelector('img');
  let col = (img && img.complete && img.naturalWidth) ? dominantColor(img) : null;
  if (!col) return hashColor(key);
  return colorCache[key] = col;
}
function glowFor(el){
  const gl = $('glow');
  if (!el || !(el.classList.contains('tile') || el.classList.contains('app')) || el.classList.contains('allapps')) {
    gl.classList.remove('on'); return;
  }
  const col = colorFor(el), r = el.getBoundingClientRect();
  el.style.setProperty('--tc', col.join(','));
  gl.style.setProperty('--gc', col.join(','));
  gl.style.setProperty('--gx', Math.round((r.left + r.width/2) / innerWidth * 100) + '%');
  gl.classList.add('on');
  gl.classList.remove('flash'); void gl.offsetWidth; gl.classList.add('flash');   // destello
}
document.addEventListener('focusin', e => {
  glowFor(e.target);
  const t = e.target;
  if (t.classList && t.classList.contains('tile')) showAppTitle(t); else hideAppTitle();
});
document.addEventListener('focusout', e => { if (!e.relatedTarget) { $('glow').classList.remove('on'); hideAppTitle(); } });

buildDock(); refreshInfo(); pollMedia();
focusHome();
