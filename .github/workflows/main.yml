name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

env:
  # El launcher nuevo: súbelo a la raíz del repo con este nombre
  HTML_SOURCE: index.html
  # Donde la app lo carga (file:///android_asset/index.html). Cámbialo si tu proyecto usa otra ruta
  HTML_TARGET: app/src/main/assets/index.html

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Poner el launcher nuevo dentro de la app
        run: |
          test -f "$HTML_SOURCE" || { echo "No encuentro $HTML_SOURCE en la raíz del repo"; exit 1; }
          mkdir -p "$(dirname "$HTML_TARGET")"
          if [ "$HTML_SOURCE" != "$HTML_TARGET" ]; then cp "$HTML_SOURCE" "$HTML_TARGET"; fi

      - name: Revisar que el JavaScript del launcher no tenga errores
        run: |
          node -e "
          const s = require('fs').readFileSync(process.env.HTML_TARGET, 'utf8');
          const m = s.match(/<script>([\s\S]*)<\/script>/);
          if (!m) { console.error('No encontré el <script> del launcher'); process.exit(1); }
          try { new Function(m[1]); console.log('JavaScript OK'); }
          catch (e) { console.error('Error de sintaxis:', e.message); process.exit(1); }
          "

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
